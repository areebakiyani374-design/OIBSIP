<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperature Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    font-family: 'Inter', sans-serif;
    background: #EFE9DD;
    color: #24231F;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 20px;
  }

  .card{
    width: 100%;
    max-width: 440px;
    background: #FBF9F4;
    border: 1px solid #DCD3BE;
    border-radius: 6px;
    padding: 40px 36px;
  }

  .icon{ width: 34px; height: 34px; margin-bottom: 18px; }

  h1{
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .subtitle{ font-size: 0.92rem; color: #6B6858; margin-bottom: 28px; }

  label{
    display:block;
    font-size: 0.85rem;
    font-weight: 600;
    color: #45443B;
    margin-bottom: 8px;
  }

  .field{ margin-bottom: 20px; }

  input[type="text"], select{
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    padding: 12px 14px;
    border: 1.5px solid #D6CDB6;
    border-radius: 4px;
    background: #fff;
    color: #24231F;
  }
  input[type="text"]:focus, select:focus{
    outline: none;
    border-color: #B4602E;
  }

  .error{
    font-size: 0.85rem;
    color: #B4472E;
    margin-top: 8px;
    min-height: 1.2em;
  }

  button{
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.98rem;
    padding: 14px;
    background: #B4602E;
    color: #FBF9F4;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.15s ease;
  }
  button:hover{ background: #94491F; }

  .results{
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px solid #DCD3BE;
    display: none;
  }
  .results.show{ display: block; }
  .result-row{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
  }
  .result-row .unit{ font-size: 0.9rem; color: #6B6858; }
  .result-row .value{ font-family: 'Fraunces', serif; font-size: 1.3rem; }

  .warning{
    margin-top: 18px;
    padding: 14px 16px;
    background: #F6E4D9;
    border: 1px solid #E0B79A;
    border-radius: 4px;
    font-size: 0.9rem;
    color: #7A3A16;
    display:none;
  }
  .warning.show{ display:block; }

  @media (max-width: 480px){
    .card{ padding: 32px 24px; }
  }
</style>
</head>
<body>

<div class="card">
  <svg class="icon" viewBox="0 0 24 24" fill="none">
    <path d="M12 15.5V5a2 2 0 10-4 0v10.5a4 4 0 104 0z" stroke="#B4602E" stroke-width="1.6"/>
    <circle cx="10" cy="18" r="1.5" fill="#B4602E"/>
  </svg>
  <h1>Temperature converter</h1>
  <p class="subtitle">Enter a value and see it in Celsius, Fahrenheit, and Kelvin.</p>

  <div class="field">
    <label for="temp-value">Temperature</label>
    <input type="text" id="temp-value" placeholder="e.g. 36.6" inputmode="decimal">
  </div>

  <div class="field">
    <label for="unit-select">Input unit</label>
    <select id="unit-select">
      <option value="C">Celsius (°C)</option>
      <option value="F">Fahrenheit (°F)</option>
      <option value="K">Kelvin (K)</option>
    </select>
  </div>

  <div class="error" id="error-msg"></div>

  <button id="convert-btn">Convert</button>

  <div class="warning" id="warning-msg"></div>

  <div class="results" id="results">
    <div class="result-row"><span class="unit">Celsius</span><span class="value" id="out-c">—</span></div>
    <div class="result-row"><span class="unit">Fahrenheit</span><span class="value" id="out-f">—</span></div>
    <div class="result-row"><span class="unit">Kelvin</span><span class="value" id="out-k">—</span></div>
  </div>
</div>

<script>
  const valueInput = document.getElementById('temp-value');
  const unitSelect = document.getElementById('unit-select');
  const errorMsg = document.getElementById('error-msg');
  const warningMsg = document.getElementById('warning-msg');
  const results = document.getElementById('results');
  const outC = document.getElementById('out-c');
  const outF = document.getElementById('out-f');
  const outK = document.getElementById('out-k');

  const ABSOLUTE_ZERO_C = -273.15;

  function toCelsius(value, unit){
    if (unit === 'C') return value;
    if (unit === 'F') return (value - 32) * 5 / 9;
    if (unit === 'K') return value - 273.15;
  }

  function round(n){
    return Math.round(n * 100) / 100;
  }

  document.getElementById('convert-btn').addEventListener('click', function(){
    errorMsg.textContent = '';
    warningMsg.classList.remove('show');
    results.classList.remove('show');

    const raw = valueInput.value.trim();

    if (raw === '' || isNaN(raw)) {
      errorMsg.textContent = 'Please enter a valid number.';
      return;
    }

    const value = parseFloat(raw);
    const unit = unitSelect.value;
    const celsius = toCelsius(value, unit);

    if (celsius < ABSOLUTE_ZERO_C - 0.0001) {
      warningMsg.textContent = 'That\'s below absolute zero (-273.15°C) — no physical temperature can go that low.';
      warningMsg.classList.add('show');
      return;
    }

    const fahrenheit = celsius * 9 / 5 + 32;
    const kelvin = celsius + 273.15;

    outC.textContent = round(celsius) + ' °C';
    outF.textContent = round(fahrenheit) + ' °F';
    outK.textContent = round(kelvin) + ' K';

    results.classList.add('show');
  });

  valueInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('convert-btn').click();
  });
</script>

</body>
</html>
